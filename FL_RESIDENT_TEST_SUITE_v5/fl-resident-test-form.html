<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FL_RESIDENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════
        NORD PALETTE
        nord0-3  Polar Night  → фоны
        nord4-6  Snow Storm   → текст
        nord7-10 Frost        → акценты
        nord11-15 Aurora      → статусы
      ═══════════════════════════════════════════ */
      :root {
        --n0: #2e3440;
        --n1: #3b4252;
        --n2: #434c5e;
        --n3: #4c566a;
        --n4: #d8dee9;
        --n5: #e5e9f0;
        --n6: #eceff4;
        --n7: #8fbcbb;
        --n8: #88c0d0;
        --n9: #81a1c1;
        --n10: #5e81ac;
        --n11: #bf616a;
        --n12: #d08770;
        --n13: #ebcb8b;
        --n14: #a3be8c;
        --n15: #b48ead;

        --bg: var(--n0);
        --surf: var(--n1);
        --elev: var(--n2);
        --active: var(--n3);
        --bdr: var(--n2);
        --bdr2: var(--n3);
        --tx: var(--n5);
        --tx-hi: var(--n6);
        --tx-lo: var(--n4);
        --tx-dim: var(--n3);
        --acc: var(--n8);
        --acc2: var(--n10);
        --teal: var(--n7);
        --blue: var(--n9);

        --ok: var(--n14);
        --ok-bg: rgba(163, 190, 140, 0.1);
        --ok-bd: rgba(163, 190, 140, 0.3);
        --exc: var(--n11);
        --exc-bg: rgba(191, 97, 106, 0.1);
        --exc-bd: rgba(191, 97, 106, 0.3);
        --err: var(--n12);
        --err-bg: rgba(208, 135, 112, 0.1);
        --err-bd: rgba(208, 135, 112, 0.3);
        --wrn: var(--n13);
        --wrn-bg: rgba(235, 203, 139, 0.1);
        --wrn-bd: rgba(235, 203, 139, 0.3);

        --sans: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", monospace;
        --r: 5px;
        --r2: 7px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--tx);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── header ── */
      .hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 58px;
        background: var(--surf);
        border-bottom: 1px solid var(--bdr);
        gap: 20px;
        flex-shrink: 0;
      }
      .hdr-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hdr-logo {
        width: 30px;
        height: 30px;
        color: var(--acc);
        flex-shrink: 0;
        filter: drop-shadow(0 0 8px rgba(136, 192, 208, 0.4));
      }
      .hdr-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--tx-hi);
      }
      .hdr-sub {
        font-size: 11px;
        color: var(--tx-dim);
        font-family: var(--mono);
        margin-top: 1px;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .url-lbl {
        font-size: 11px;
        color: var(--n9);
        font-family: var(--mono);
        white-space: nowrap;
        font-weight: 500;
      }
      .url-inp {
        background: var(--bg);
        border: 1px solid var(--bdr);
        border-radius: var(--r);
        color: var(--teal);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 10px;
        width: 240px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .url-inp:focus {
        border-color: var(--n9);
        box-shadow: 0 0 0 2px rgba(129, 161, 193, 0.15);
      }

      /* ── toolbar ── */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 50px;
        background: var(--surf);
        border-bottom: 1px solid var(--bdr);
        gap: 16px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .tb-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tb-lbl {
        font-size: 11px;
        color: var(--n9);
        font-family: var(--mono);
        white-space: nowrap;
        font-weight: 500;
      }
      .pipe-tabs {
        display: flex;
        gap: 3px;
      }
      .pipe-tab {
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--r);
        color: var(--tx-dim);
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 11px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .pipe-tab:hover {
        background: var(--elev);
        color: var(--tx-lo);
        border-color: var(--bdr);
      }
      .pipe-tab.on {
        background: rgba(136, 192, 208, 0.12);
        border-color: rgba(136, 192, 208, 0.35);
        color: var(--acc);
      }
      .tb-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: var(--r);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 500;
        padding: 6px 14px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--bdr);
        color: var(--tx-lo);
      }
      .btn-ghost:hover {
        background: var(--elev);
        border-color: var(--bdr2);
        color: var(--tx-hi);
      }
      .btn-run {
        background: var(--n10);
        border: 1px solid var(--n10);
        color: var(--n6);
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 8px rgba(94, 129, 172, 0.3);
      }
      .btn-run:hover:not(:disabled) {
        background: var(--n9);
        border-color: var(--n9);
        box-shadow: 0 2px 12px rgba(129, 161, 193, 0.4);
      }
      .btn-run:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* ── alerts ── */
      .alert {
        padding: 9px 24px;
        font-size: 12px;
        font-family: var(--mono);
        border-bottom: 1px solid;
      }
      .alert-warn {
        background: var(--wrn-bg);
        color: var(--wrn);
        border-color: var(--wrn-bd);
      }
      .alert-err {
        background: var(--exc-bg);
        color: var(--exc);
        border-color: var(--exc-bd);
      }

      /* ── main layout ── */
      .main {
        display: grid;
        grid-template-columns: 1fr 460px;
        flex: 1;
        min-height: 0;
      }
      @media (max-width: 1024px) {
        .main {
          grid-template-columns: 1fr;
        }
      }

      /* ── form col ── */
      .form-col {
        overflow-y: auto;
        border-right: 1px solid var(--bdr);
        background: var(--bg);
      }

      /* ── blocks ── */
      .block {
        border-bottom: 1px solid var(--bdr);
      }
      .block-head {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: transparent;
        border: none;
        padding: 11px 20px;
        cursor: pointer;
        text-align: left;
        transition: background 0.12s;
      }
      .block-head:hover {
        background: rgba(59, 66, 82, 0.4);
      }
      .block-num {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--n10);
        font-weight: 600;
        min-width: 20px;
        letter-spacing: 0.08em;
      }
      .block-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--n5);
        flex: 1;
        letter-spacing: 0.02em;
      }
      .block-arrow {
        font-size: 11px;
        color: var(--tx-dim);
        transition: transform 0.2s;
        display: inline-block;
      }
      .block-arrow.open {
        transform: rotate(90deg);
      }
      .block-body {
        padding: 14px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid var(--bdr);
      }

      /* ── fields ── */
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field-lbl {
        font-size: 11px;
        color: var(--n8);
        font-family: var(--mono);
        font-weight: 500;
        letter-spacing: 0.03em;
      }
      .field-hint {
        color: var(--n9);
        opacity: 0.85;
      }
      .inp {
        background: var(--surf);
        border: 1px solid var(--bdr);
        border-radius: var(--r);
        color: var(--tx);
        font-family: var(--sans);
        font-size: 13px;
        padding: 7px 10px;
        outline: none;
        width: 100%;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s,
          color 0.15s;
      }
      .inp.mono {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--n4);
      }
      .inp:focus {
        border-color: var(--n8);
        box-shadow: 0 0 0 2px rgba(136, 192, 208, 0.2);
        background: var(--n6);
        color: var(--n0);
      }
      .inp.mono:focus {
        color: var(--n1);
      }
      .inp::placeholder {
        color: var(--n3);
        opacity: 0.9;
      }
      input[type="date"].inp {
        color-scheme: dark;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 700px) {
        .row2,
        .row3 {
          grid-template-columns: 1fr;
        }
      }

      /* ── toggles ── */
      .tog {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        padding: 2px 0;
      }
      .tog input {
        display: none;
      }
      .tog-track {
        position: relative;
        width: 34px;
        height: 19px;
        border-radius: 10px;
        background: var(--active);
        border: 1px solid var(--bdr2);
        flex-shrink: 0;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .tog-track.on {
        background: rgba(94, 129, 172, 0.5);
        border-color: var(--n10);
      }
      .tog-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--n3);
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .tog-track.on .tog-thumb {
        transform: translateX(15px);
        background: var(--acc);
      }
      .tog-lbl {
        font-size: 12px;
        color: var(--n5);
        font-family: var(--mono);
      }
      .tog-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tog-wrap {
        padding-top: 6px;
      }
      .foreign-block {
        margin-top: 4px;
        border: 1px solid rgba(136, 192, 208, 0.2);
        border-radius: var(--r2);
        padding: 12px 14px;
        background: rgba(136, 192, 208, 0.04);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .foreign-lbl {
        font-size: 11px;
        color: var(--teal);
        font-family: var(--mono);
      }

      /* ── result col ── */
      .result-col {
        background: var(--surf);
        overflow-y: auto;
      }

      /* ── placeholder ── */
      .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 64px 32px;
        min-height: 400px;
        text-align: center;
      }
      .ph-icon {
        width: 52px;
        height: 52px;
        color: var(--n3);
        opacity: 0.7;
      }
      .ph-text {
        font-size: 13px;
        color: var(--tx-lo);
        line-height: 1.7;
      }
      .ph-hint {
        font-size: 11px;
        color: var(--tx-dim);
        line-height: 1.6;
        max-width: 260px;
        font-family: var(--mono);
      }

      /* ── spinner ── */
      .spin {
        display: inline-block;
        width: 15px;
        height: 15px;
        border: 2px solid rgba(136, 192, 208, 0.2);
        border-top-color: var(--acc);
        border-radius: 50%;
        animation: rot 0.65s linear infinite;
      }
      .spin.lg {
        width: 34px;
        height: 34px;
        border-width: 3px;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── result panel ── */
      .result-wrap {
        display: flex;
        flex-direction: column;
      }
      .result-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--bdr);
        flex-wrap: wrap;
        gap: 10px;
      }
      .stat-ok {
        background: var(--ok-bg);
        border-left: 3px solid var(--ok);
      }
      .stat-exc {
        background: var(--exc-bg);
        border-left: 3px solid var(--exc);
      }
      .stat-abort {
        background: var(--err-bg);
        border-left: 3px solid var(--err);
      }
      .rs-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rs-icon {
        font-size: 17px;
        line-height: 1;
      }
      .stat-ok .rs-icon {
        color: var(--ok);
      }
      .stat-exc .rs-icon {
        color: var(--exc);
      }
      .stat-abort .rs-icon {
        color: var(--err);
      }
      .rs-text {
        font-size: 13px;
        font-weight: 600;
        font-family: var(--mono);
        letter-spacing: 0.06em;
      }
      .stat-ok .rs-text {
        color: var(--ok);
      }
      .stat-exc .rs-text {
        color: var(--exc);
      }
      .stat-abort .rs-text {
        color: var(--err);
      }
      .rs-ctrl {
        font-size: 11px;
        color: var(--tx-dim);
        font-family: var(--mono);
      }
      .rs-counts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .rc {
        font-size: 10px;
        font-weight: 600;
        font-family: var(--mono);
        padding: 2px 8px;
        border-radius: var(--r);
        letter-spacing: 0.04em;
        border: 1px solid;
      }
      .lv-exc {
        background: var(--exc-bg);
        color: var(--exc);
        border-color: var(--exc-bd);
      }
      .lv-err {
        background: var(--err-bg);
        color: var(--err);
        border-color: var(--err-bd);
      }
      .lv-wrn {
        background: var(--wrn-bg);
        color: var(--wrn);
        border-color: var(--wrn-bd);
      }
      .ok-msg {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 20px;
        color: var(--ok);
        font-size: 13px;
        font-family: var(--mono);
        border-bottom: 1px solid var(--bdr);
        background: var(--ok-bg);
      }

      /* ── tabs ── */
      .res-tabs {
        display: flex;
        background: var(--surf);
        border-bottom: 1px solid var(--bdr);
      }
      .rtab {
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--tx-dim);
        font-family: var(--mono);
        font-size: 11px;
        padding: 10px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.13s;
      }
      .rtab:hover {
        color: var(--tx-lo);
      }
      .rtab.on {
        color: var(--acc);
        border-bottom-color: var(--acc);
      }
      .rtab-cnt {
        background: var(--elev);
        color: var(--tx-dim);
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 8px;
      }
      .rtab.on .rtab-cnt {
        background: rgba(136, 192, 208, 0.2);
        color: var(--acc);
      }

      /* ── issues ── */
      .issues {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .iss-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .iss-group-head {
        font-size: 10px;
        font-weight: 600;
        font-family: var(--mono);
        letter-spacing: 0.1em;
        padding: 4px 10px;
        border-radius: var(--r);
        border: 1px solid;
      }
      .iss-card {
        border-radius: var(--r2);
        border: 1px solid;
        padding: 10px 13px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        animation: fup 0.18s ease both;
        background: var(--bg);
      }
      @keyframes fup {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .iss-card.lv-exc {
        border-color: var(--exc-bd);
      }
      .iss-card.lv-err {
        border-color: var(--err-bd);
      }
      .iss-card.lv-wrn {
        border-color: var(--wrn-bd);
      }
      .iss-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .iss-code {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .lv-exc .iss-code {
        color: var(--exc);
      }
      .lv-err .iss-code {
        color: var(--err);
      }
      .lv-wrn .iss-code {
        color: var(--wrn);
      }
      .iss-msg {
        font-size: 12px;
        color: var(--tx);
        line-height: 1.5;
      }
      .iss-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 2px;
      }
      .im {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .imk {
        font-size: 10px;
        color: var(--tx-dim);
        font-family: var(--mono);
      }
      .imv {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tx-lo);
        background: var(--elev);
        padding: 1px 6px;
        border-radius: 3px;
        border: 1px solid var(--bdr);
      }

      /* ── json ── */
      .json-block {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--tx-lo);
        padding: 16px 20px;
        white-space: pre-wrap;
        word-break: break-all;
        line-height: 1.65;
        background: var(--bg);
        overflow-x: auto;
      }

      /* ── misc ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--n2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--n3);
      }
      ::selection {
        background: rgba(136, 192, 208, 0.25);
        color: var(--tx-hi);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useRef, useCallback } = React;

      /* ── constants ── */
      const PIPELINES = [
        {
          id: "entrypoints.b.fl_resident.full_validation",
          label: "full_validation · канал B",
          mode: "full",
        },
        {
          id: "entrypoints.c.fl_resident.full_validation",
          label: "full_validation · канал C",
          mode: "full",
        },
        {
          id: "entrypoints.c.fl_resident.precheck_min",
          label: "precheck_min · канал C",
          mode: "pre",
        },
      ];

      const EMPTY = {
        pipelineId: PIPELINES[0].id,
        inn: "",
        participationId: "",
        lastName: "",
        firstName: "",
        middleName: "",
        birthDate: "",
        birthPlace: "",
        citizenshipCode: "RU",
        docTypeCode: "21",
        docTypeName: "Паспорт РФ",
        docSeries: "",
        docNumber: "",
        docIssueDate: "",
        docIssuer: "",
        docIssuerCode: "",
        isForeignIdDoc: false,
        regAddressLine: "",
        regCountryCode: "RU",
        usTaxResident: false,
        usResident: false,
        foreignTaxResident: false,
        foreignCountryCode: "",
        foreignTin: "",
        foreignAddress: "",
        statusStartDate: "",
        phone: "",
        email: "",
        postalAddress: "",
      };

      /* ── payload builder ── */
      function buildRequest(f) {
        const p = {};
        const add = (k, v) => {
          if (v !== "" && v != null) p[k] = v;
        };
        add("beneficiary.type", "FL_RESIDENT");
        add("beneficiary.inn", f.inn);
        add("beneficiary.participationId", f.participationId);
        add("beneficiary.fl.lastName", f.lastName);
        add("beneficiary.fl.firstName", f.firstName);
        add("beneficiary.fl.middleName", f.middleName);
        add("beneficiary.fl.birthDate", f.birthDate);
        add("beneficiary.fl.birthPlace", f.birthPlace);
        add("beneficiary.fl.citizenshipCode", f.citizenshipCode);
        add("beneficiary.idDoc.typeCode", f.docTypeCode);
        add("beneficiary.idDoc.typeName", f.docTypeName);
        add("beneficiary.idDoc.series", f.docSeries);
        add("beneficiary.idDoc.number", f.docNumber);
        add("beneficiary.idDoc.issueDate", f.docIssueDate);
        add("beneficiary.idDoc.issuer", f.docIssuer);
        add("beneficiary.idDoc.issuerCode", f.docIssuerCode);
        p["beneficiary.idDoc.isForeignIdDoc"] = Boolean(f.isForeignIdDoc);
        add("beneficiary.address.registration.addressLine", f.regAddressLine);
        add("beneficiary.address.registration.countryCode", f.regCountryCode);
        p["beneficiary.tax.usTaxResident"] = Boolean(f.usTaxResident);
        p["beneficiary.tax.usResident"] = Boolean(f.usResident);
        p["beneficiary.tax.foreignTaxResident"] = Boolean(f.foreignTaxResident);
        if (f.foreignTaxResident) {
          add(
            "beneficiary.tax.foreignResidencies0.countryCode",
            f.foreignCountryCode,
          );
          add("beneficiary.tax.foreignResidencies0.tin", f.foreignTin);
          add("beneficiary.tax.foreignResidencies0.address", f.foreignAddress);
        }
        add("beneficiary.status.startDate", f.statusStartDate);
        add("beneficiary.contacts.phone", f.phone);
        add("beneficiary.contacts.email", f.email);
        add("beneficiary.contacts.postalAddress", f.postalAddress);
        return { context: { pipelineId: f.pipelineId }, payload: p };
      }

      /* ── payload → form ── */
      function p2f(p, ctxId) {
        const g = (k, d = "") => (k in p ? p[k] : d);
        const gb = (k, d = false) => (p[k] === undefined ? d : Boolean(p[k]));
        const pid =
          ctxId && PIPELINES.find((x) => x.id === ctxId)
            ? ctxId
            : PIPELINES[0].id;
        return {
          pipelineId: pid,
          inn: g("beneficiary.inn"),
          participationId: g("beneficiary.participationId"),
          lastName: g("beneficiary.fl.lastName"),
          firstName: g("beneficiary.fl.firstName"),
          middleName: g("beneficiary.fl.middleName"),
          birthDate: g("beneficiary.fl.birthDate"),
          birthPlace: g("beneficiary.fl.birthPlace"),
          citizenshipCode: g("beneficiary.fl.citizenshipCode", "RU"),
          docTypeCode: g("beneficiary.idDoc.typeCode", "21"),
          docTypeName: g("beneficiary.idDoc.typeName", "Паспорт РФ"),
          docSeries: g("beneficiary.idDoc.series"),
          docNumber: g("beneficiary.idDoc.number"),
          docIssueDate: g("beneficiary.idDoc.issueDate"),
          docIssuer: g("beneficiary.idDoc.issuer"),
          docIssuerCode: g("beneficiary.idDoc.issuerCode"),
          isForeignIdDoc: gb("beneficiary.idDoc.isForeignIdDoc"),
          regAddressLine: g("beneficiary.address.registration.addressLine"),
          regCountryCode: g(
            "beneficiary.address.registration.countryCode",
            "RU",
          ),
          usTaxResident: gb("beneficiary.tax.usTaxResident"),
          usResident: gb("beneficiary.tax.usResident"),
          foreignTaxResident: gb("beneficiary.tax.foreignTaxResident"),
          foreignCountryCode: g(
            "beneficiary.tax.foreignResidencies0.countryCode",
          ),
          foreignTin: g("beneficiary.tax.foreignResidencies0.tin"),
          foreignAddress: g("beneficiary.tax.foreignResidencies0.address"),
          statusStartDate: g("beneficiary.status.startDate"),
          phone: g("beneficiary.contacts.phone"),
          email: g("beneficiary.contacts.email"),
          postalAddress: g("beneficiary.contacts.postalAddress"),
        };
      }

      /* ── ui primitives ── */
      function F({ label, hint, wide, children }) {
        return (
          <div className={"field" + (wide ? " wide" : "")}>
            <span className="field-lbl">
              {label}
              {hint && <span className="field-hint"> · {hint}</span>}
            </span>
            {children}
          </div>
        );
      }

      function Inp({ value, onChange, mono, ...rest }) {
        return (
          <input
            className={"inp" + (mono ? " mono" : "")}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            autoComplete="off"
            {...rest}
          />
        );
      }

      function Tog({ checked, onChange, label }) {
        return (
          <label className="tog">
            <span
              className={"tog-track" + (checked ? " on" : "")}
              onClick={() => onChange(!checked)}
            >
              <span className="tog-thumb" />
            </span>
            <input
              type="checkbox"
              checked={checked}
              onChange={(e) => onChange(e.target.checked)}
            />
            <span className="tog-lbl">{label}</span>
          </label>
        );
      }

      function Block({ id, title, children, defaultOpen = true }) {
        const [open, setOpen] = useState(defaultOpen);
        return (
          <section className="block">
            <button className="block-head" onClick={() => setOpen((o) => !o)}>
              <span className="block-num">{id}</span>
              <span className="block-title">{title}</span>
              <span className={"block-arrow" + (open ? " open" : "")}>▸</span>
            </button>
            {open && <div className="block-body">{children}</div>}
          </section>
        );
      }

      /* ── result panel ── */
      const LV = { EXCEPTION: "lv-exc", ERROR: "lv-err", WARNING: "lv-wrn" };

      function ResultPanel({ result, request }) {
        const [tab, setTab] = useState("issues");
        const { status, control, issues = [] } = result;
        const isOk = status === "OK" && issues.length === 0;
        const byLv = { EXCEPTION: [], ERROR: [], WARNING: [] };
        issues.forEach((i) => {
          const l = i.level in byLv ? i.level : "ERROR";
          byLv[l].push(i);
        });
        const sc =
          status === "OK"
            ? "stat-ok"
            : status === "EXCEPTION"
              ? "stat-exc"
              : "stat-abort";

        return (
          <div className="result-wrap">
            <div className={"result-status " + sc}>
              <div className="rs-left">
                <span className="rs-icon">
                  {isOk ? "✓" : status === "ABORT" ? "✕" : "⚠"}
                </span>
                <span className="rs-text">{status}</span>
                <span className="rs-ctrl">control: {control}</span>
              </div>
              {issues.length > 0 && (
                <div className="rs-counts">
                  {byLv.EXCEPTION.length > 0 && (
                    <span className="rc lv-exc">
                      {byLv.EXCEPTION.length} EXCEPTION
                    </span>
                  )}
                  {byLv.ERROR.length > 0 && (
                    <span className="rc lv-err">{byLv.ERROR.length} ERROR</span>
                  )}
                  {byLv.WARNING.length > 0 && (
                    <span className="rc lv-wrn">
                      {byLv.WARNING.length} WARNING
                    </span>
                  )}
                </div>
              )}
            </div>

            {isOk && (
              <div className="ok-msg">
                <span>◈</span> Данные прошли проверку. Нарушений не выявлено.
              </div>
            )}

            <div className="res-tabs">
              {issues.length > 0 && (
                <button
                  className={"rtab" + (tab === "issues" ? " on" : "")}
                  onClick={() => setTab("issues")}
                >
                  Issues <span className="rtab-cnt">{issues.length}</span>
                </button>
              )}
              <button
                className={"rtab" + (tab === "request" ? " on" : "")}
                onClick={() => setTab("request")}
              >
                Request JSON
              </button>
              <button
                className={"rtab" + (tab === "response" ? " on" : "")}
                onClick={() => setTab("response")}
              >
                Response JSON
              </button>
            </div>

            {tab === "issues" && issues.length > 0 && (
              <div className="issues">
                {["EXCEPTION", "ERROR", "WARNING"].map((lv) =>
                  byLv[lv].length === 0 ? null : (
                    <div key={lv} className="iss-group">
                      <div className={"iss-group-head rc " + LV[lv]}>
                        {lv} · {byLv[lv].length}
                      </div>
                      {byLv[lv].map((iss, i) => (
                        <div
                          key={i}
                          className={"iss-card " + (LV[iss.level] || "lv-err")}
                        >
                          <div className="iss-top">
                            <code className="iss-code">{iss.code}</code>
                          </div>
                          <div className="iss-msg">{iss.message}</div>
                          <div className="iss-meta">
                            {iss.field && (
                              <span className="im">
                                <span className="imk">field</span>
                                <code className="imv">{iss.field}</code>
                              </span>
                            )}
                            {iss.actual != null && (
                              <span className="im">
                                <span className="imk">actual</span>
                                <code className="imv">
                                  {String(iss.actual)}
                                </code>
                              </span>
                            )}
                            {iss.ruleId && (
                              <span className="im">
                                <span className="imk">rule</span>
                                <code className="imv">{iss.ruleId}</code>
                              </span>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  ),
                )}
              </div>
            )}
            {tab === "request" && (
              <pre className="json-block">
                {JSON.stringify(request, null, 2)}
              </pre>
            )}
            {tab === "response" && (
              <pre className="json-block">
                {JSON.stringify(result, null, 2)}
              </pre>
            )}
          </div>
        );
      }

      /* ── main app ── */
      function App() {
        const [form, setForm] = useState(EMPTY);
        const [baseUrl, setBaseUrl] = useState("http://localhost:3000");
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);
        const [lastReq, setLastReq] = useState(null);
        const [netErr, setNetErr] = useState(null);
        const [jsonErr, setJsonErr] = useState(null);
        const fileRef = useRef();

        const set = useCallback((k, v) => {
          setForm((f) => ({ ...f, [k]: v }));
          setResult(null);
          setNetErr(null);
        }, []);
        const pipe =
          PIPELINES.find((p) => p.id === form.pipelineId) || PIPELINES[0];
        const isPre = pipe.mode === "pre";

        const handleFile = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          setJsonErr(null);
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              const raw = parsed.payload ?? parsed;
              setForm(p2f(raw, parsed.context?.pipelineId));
              setResult(null);
              setNetErr(null);
            } catch (err) {
              setJsonErr("Ошибка разбора JSON: " + err.message);
            }
          };
          reader.readAsText(file);
          e.target.value = "";
        };

        const handleSubmit = async () => {
          setLoading(true);
          setResult(null);
          setNetErr(null);
          const body = buildRequest(form);
          setLastReq(body);
          try {
            const res = await fetch(
              baseUrl.replace(/\/$/, "") + "/v1/validate",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              },
            );
            setResult(await res.json());
          } catch (err) {
            setNetErr("Нет соединения с движком: " + err.message);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              minHeight: "100vh",
            }}
          >
            {/* header */}
            <header className="hdr">
              <div className="hdr-brand">
                <svg className="hdr-logo" viewBox="0 0 24 24" fill="none">
                  <polygon
                    points="12,2 22,7 22,17 12,22 2,17 2,7"
                    stroke="currentColor"
                    strokeWidth="1.5"
                  />
                  <polygon
                    points="12,7 17,9.5 17,14.5 12,17 7,14.5 7,9.5"
                    fill="currentColor"
                    opacity=".2"
                  />
                  <circle cx="12" cy="12" r="2" fill="currentColor" />
                </svg>
                <div>
                  <div className="hdr-title">FL_RESIDENT</div>
                  <div className="hdr-sub">Rule Engine Manual Tester</div>
                </div>
              </div>
              <div className="hdr-right">
                <span className="url-lbl">Engine URL</span>
                <input
                  className="url-inp"
                  value={baseUrl}
                  onChange={(e) => setBaseUrl(e.target.value)}
                  spellCheck={false}
                />
              </div>
            </header>

            {/* toolbar */}
            <div className="toolbar">
              <div className="tb-left">
                <span className="tb-lbl">Пайплайн</span>
                <div className="pipe-tabs">
                  {PIPELINES.map((p) => (
                    <button
                      key={p.id}
                      className={
                        "pipe-tab" + (form.pipelineId === p.id ? " on" : "")
                      }
                      onClick={() => set("pipelineId", p.id)}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
              <div className="tb-right">
                <button
                  className="btn btn-ghost"
                  onClick={() => fileRef.current?.click()}
                >
                  ⇪ JSON
                </button>
                <input
                  ref={fileRef}
                  type="file"
                  accept=".json"
                  style={{ display: "none" }}
                  onChange={handleFile}
                />
                <button
                  className="btn btn-ghost"
                  onClick={() => {
                    setForm(EMPTY);
                    setResult(null);
                    setNetErr(null);
                    setJsonErr(null);
                  }}
                >
                  Сброс
                </button>
                <button
                  className="btn btn-run"
                  onClick={handleSubmit}
                  disabled={loading}
                >
                  {loading ? <span className="spin" /> : <>▶ Запустить</>}
                </button>
              </div>
            </div>

            {jsonErr && <div className="alert alert-warn">⚠ {jsonErr}</div>}
            {netErr && <div className="alert alert-err">✕ {netErr}</div>}

            <div className="main" style={{ flex: 1 }}>
              {/* form */}
              <div className="form-col">
                <Block id="01" title="Идентификация">
                  <div className="row2">
                    <F label="ИНН" hint="12 цифр">
                      <Inp
                        mono
                        value={form.inn}
                        onChange={(v) => set("inn", v)}
                        placeholder="744404355804"
                        maxLength={12}
                      />
                    </F>
                    {!isPre && (
                      <F label="Идентификатор участия в договоре">
                        <Inp
                          mono
                          value={form.participationId}
                          onChange={(v) => set("participationId", v)}
                          placeholder="TEST-536779508951"
                        />
                      </F>
                    )}
                  </div>
                </Block>

                <Block id="02" title="Персональные данные">
                  <div className="row3">
                    <F label="Фамилия">
                      <Inp
                        value={form.lastName}
                        onChange={(v) => set("lastName", v)}
                        placeholder="Петров"
                      />
                    </F>
                    <F label="Имя">
                      {" "}
                      <Inp
                        value={form.firstName}
                        onChange={(v) => set("firstName", v)}
                        placeholder="Алексей"
                      />
                    </F>
                    <F label="Отчество">
                      <Inp
                        value={form.middleName}
                        onChange={(v) => set("middleName", v)}
                        placeholder="Анатольевич"
                      />
                    </F>
                  </div>
                  {!isPre && (
                    <>
                      <div className="row3">
                        <F label="Дата рождения" hint="YYYY-MM-DD">
                          <Inp
                            mono
                            type="date"
                            value={form.birthDate}
                            onChange={(v) => set("birthDate", v)}
                          />
                        </F>
                        <F label="Гражданство" hint="ISO alpha-2">
                          <Inp
                            mono
                            value={form.citizenshipCode}
                            onChange={(v) => set("citizenshipCode", v)}
                            placeholder="RU"
                            maxLength={2}
                          />
                        </F>
                        <F label="Дата начала статуса" hint="YYYY-MM-DD">
                          <Inp
                            mono
                            type="date"
                            value={form.statusStartDate}
                            onChange={(v) => set("statusStartDate", v)}
                          />
                        </F>
                      </div>
                      <F label="Место рождения" wide>
                        <Inp
                          value={form.birthPlace}
                          onChange={(v) => set("birthPlace", v)}
                          placeholder="гор. МАГНИТОГОРСК ЧЕЛЯБИНСКОЙ ОБЛАСТИ"
                        />
                      </F>
                    </>
                  )}
                </Block>

                {!isPre && (
                  <>
                    <Block id="03" title="Документ удостоверяющий личность">
                      <div className="row2">
                        <F label="Код типа" hint="21 — Паспорт РФ">
                          <Inp
                            mono
                            value={form.docTypeCode}
                            onChange={(v) => set("docTypeCode", v)}
                            placeholder="21"
                          />
                        </F>
                        <F label="Наименование типа">
                          <Inp
                            value={form.docTypeName}
                            onChange={(v) => set("docTypeName", v)}
                            placeholder="Паспорт РФ"
                          />
                        </F>
                      </div>
                      <div className="row3">
                        <F label="Серия" hint="4 цифры">
                          <Inp
                            mono
                            value={form.docSeries}
                            onChange={(v) => set("docSeries", v)}
                            placeholder="4507"
                            maxLength={4}
                          />
                        </F>
                        <F label="Номер" hint="6 цифр">
                          <Inp
                            mono
                            value={form.docNumber}
                            onChange={(v) => set("docNumber", v)}
                            placeholder="360952"
                            maxLength={6}
                          />
                        </F>
                        <F label="Дата выдачи" hint="YYYY-MM-DD">
                          <Inp
                            mono
                            type="date"
                            value={form.docIssueDate}
                            onChange={(v) => set("docIssueDate", v)}
                          />
                        </F>
                      </div>
                      <F label="Кем выдан" wide>
                        <Inp
                          value={form.docIssuer}
                          onChange={(v) => set("docIssuer", v)}
                          placeholder='ОВД РАЙОНА "БОГОРОДСКОЕ" ГОРОДА МОСКВЫ'
                        />
                      </F>
                      <div className="row2">
                        <F label="Код подразделения" hint="NNN-NNN">
                          <Inp
                            mono
                            value={form.docIssuerCode}
                            onChange={(v) => set("docIssuerCode", v)}
                            placeholder="770-001"
                          />
                        </F>
                        <F label="Флаг">
                          <div className="tog-wrap">
                            <Tog
                              checked={form.isForeignIdDoc}
                              onChange={(v) => set("isForeignIdDoc", v)}
                              label="isForeignIdDoc"
                            />
                          </div>
                        </F>
                      </div>
                    </Block>

                    <Block id="04" title="Адрес регистрации">
                      <F label="Адресная строка" wide>
                        <Inp
                          value={form.regAddressLine}
                          onChange={(v) => set("regAddressLine", v)}
                          placeholder="350063, Краснодарский край, г Краснодар, ул им. Пушкина, д 6, кв 20"
                        />
                      </F>
                      <F label="Код страны" hint="ISO alpha-2">
                        <Inp
                          mono
                          value={form.regCountryCode}
                          onChange={(v) => set("regCountryCode", v)}
                          placeholder="RU"
                          maxLength={2}
                        />
                      </F>
                    </Block>

                    <Block id="05" title="Налоговый статус">
                      <div className="tog-list">
                        <Tog
                          checked={form.usTaxResident}
                          onChange={(v) => set("usTaxResident", v)}
                          label="Налоговый резидент США"
                        />
                        <Tog
                          checked={form.usResident}
                          onChange={(v) => set("usResident", v)}
                          label="Резидент США"
                        />
                        <Tog
                          checked={form.foreignTaxResident}
                          onChange={(v) => set("foreignTaxResident", v)}
                          label="Иностранный налоговый резидент"
                        />
                      </div>
                      {form.foreignTaxResident && (
                        <div className="foreign-block">
                          <div className="foreign-lbl">
                            ▸ Данные иностранного резидентства
                            (foreignResidencies[0])
                          </div>
                          <div className="row2">
                            <F label="countryCode" hint="ISO alpha-2">
                              <Inp
                                mono
                                value={form.foreignCountryCode}
                                onChange={(v) => set("foreignCountryCode", v)}
                                placeholder="DE"
                                maxLength={2}
                              />
                            </F>
                            <F label="TIN">
                              <Inp
                                mono
                                value={form.foreignTin}
                                onChange={(v) => set("foreignTin", v)}
                                placeholder="DE123456789"
                              />
                            </F>
                          </div>
                          <F label="address" wide>
                            <Inp
                              value={form.foreignAddress}
                              onChange={(v) => set("foreignAddress", v)}
                              placeholder="Berlin, Alexanderplatz 1"
                            />
                          </F>
                        </div>
                      )}
                    </Block>

                    <Block id="06" title="Контакты">
                      <div className="row2">
                        <F label="Телефон" hint="10 цифр">
                          <Inp
                            mono
                            value={form.phone}
                            onChange={(v) => set("phone", v)}
                            placeholder="9801611004"
                          />
                        </F>
                        <F label="Email">
                          <Inp
                            type="email"
                            value={form.email}
                            onChange={(v) => set("email", v)}
                            placeholder="user@example.com"
                          />
                        </F>
                      </div>
                      <F label="Почтовый адрес" wide>
                        <Inp
                          value={form.postalAddress}
                          onChange={(v) => set("postalAddress", v)}
                          placeholder="107023, Москва, Красносельская, д.1"
                        />
                      </F>
                    </Block>
                  </>
                )}
              </div>

              {/* result */}
              <div className="result-col">
                {!result && !loading && (
                  <div className="placeholder">
                    <svg className="ph-icon" viewBox="0 0 48 48" fill="none">
                      <circle
                        cx="24"
                        cy="24"
                        r="20"
                        stroke="currentColor"
                        strokeWidth="1"
                      />
                      <path
                        d="M16 24L24 16L32 24L24 32Z"
                        stroke="currentColor"
                        strokeWidth="1"
                        fill="none"
                      />
                      <circle
                        cx="24"
                        cy="24"
                        r="3"
                        fill="currentColor"
                        opacity=".4"
                      />
                    </svg>
                    <p className="ph-text">
                      Заполните форму
                      <br />и запустите проверку
                    </p>
                    <p className="ph-hint">
                      Или загрузите готовый JSON-файл пэйлоада кнопкой{" "}
                      <strong>⇪ JSON</strong>
                    </p>
                  </div>
                )}
                {loading && (
                  <div className="placeholder">
                    <span className="spin lg" />
                    <p className="ph-text">Отправка запроса…</p>
                  </div>
                )}
                {result && !loading && (
                  <ResultPanel result={result} request={lastReq} />
                )}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
